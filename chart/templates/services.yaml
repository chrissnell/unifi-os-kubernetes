{{- $fullName := include "unifi-os-server.fullname" . -}}
{{- $sel := include "unifi-os-server.selectorLabels" . -}}
{{- $labels := include "unifi-os-server.labels" . -}}
{{- $svc := .Values.service -}}
{{- range $name, $p := .Values.ports }}
{{- if $p.enabled }}
{{- /*
  Build each metadata map once, highest precedence first, so a user-supplied
  key overrides rather than emitting a duplicate YAML key. Chart-owned labels
  outrank user labels: the port label and the common labels both carry the
  identity that spec.selector below is built from, so letting a user reassign
  them would silently desync metadata.labels from the selector. `merge` writes
  into its first argument, so that argument is a fresh dict, never a live
  .Values map.
*/}}
{{- $mergedLabels := merge (dict "unifi-os-server.io/port" $name) (fromYaml $labels) (default (dict) $p.labels) (default (dict) $svc.labels) }}
{{- $mergedAnnotations := merge (dict) (default (dict) $p.annotations) (default (dict) $svc.annotations) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-%s" $fullName ($name | kebabcase) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- toYaml $mergedLabels | nindent 4 }}
  {{- if $mergedAnnotations }}
  annotations:
    {{- toYaml $mergedAnnotations | nindent 4 }}
  {{- end }}
spec:
  type: {{ $svc.type }}
  {{- if and (eq $svc.type "LoadBalancer") $svc.loadBalancerIP }}
  loadBalancerIP: {{ $svc.loadBalancerIP }}
  {{- end }}
  {{- if and (or (eq $svc.type "LoadBalancer") (eq $svc.type "NodePort")) $svc.externalTrafficPolicy }}
  externalTrafficPolicy: {{ $svc.externalTrafficPolicy }}
  {{- end }}
  selector:
    {{- $sel | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - name: {{ $name | lower | trunc 15 }}
      port: {{ $p.port }}
      targetPort: {{ $p.targetPort }}
      protocol: {{ $p.protocol }}
{{- end }}
{{- end }}
